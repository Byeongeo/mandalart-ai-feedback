# 앱 업데이트: 원본(Byeongeo/mandalart-ai-feedback)의 최신 코드로 이 저장소를 덮어씁니다(.github 폴더는 그대로 둠).
# Actions > 앱 업데이트 > Run workflow 를 눌렀을 때만 실행됩니다. 커밋 작성자는 실행한 사람입니다(Vercel Hobby 배포 조건).
name: 앱 업데이트
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: app-update
jobs:
  update:
    if: github.repository != 'Byeongeo/mandalart-ai-feedback'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: 원본에서 최신 코드 받기
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 https://github.com/Byeongeo/mandalart-ai-feedback.git main
          sha="$(git rev-parse --short FETCH_HEAD)"
          git read-tree --reset -u FETCH_HEAD
          git rm -r -q --cached --ignore-unmatch -- .github
          rm -rf .github
          if git cat-file -e HEAD:.github 2>/dev/null; then git checkout HEAD -- .github; fi
          if git diff --cached --quiet HEAD; then
            echo "✅ 이미 최신입니다. 바꿀 것이 없습니다." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git commit -q -m "앱 업데이트: 원본 $sha 반영"
          git push origin HEAD:main
          echo "✅ 원본 $sha 을(를) 반영했습니다. 몇 분 뒤 Vercel > Deployments 에서 새 배포가 Ready 인지 확인하세요." >> "$GITHUB_STEP_SUMMARY"
